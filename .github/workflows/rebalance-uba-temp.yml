name: Rebalance UBA divisions

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rebalance-uba-temp.yml"

permissions:
  contents: write

jobs:
  rebalance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebalance divisions
        shell: python
        run: |
          from pathlib import Path

          path = Path("Leagues/UBA_Classic/United Basketball Association.txt")
          text = path.read_text(encoding="utf-8")

          edits = [
              ('"id":26,"isPlayer":false,"city":"Denver","name":"Peaks","shortName":"DEN"', 2, 0),
              ('"id":19,"isPlayer":false,"city":"Los Angeles","name":"Breakers","shortName":"LA"', 0, 2),
              ('"id":22,"isPlayer":false,"city":"Washington","name":"Federals","shortName":"WAS"', 5, 3),
              ('"id":23,"isPlayer":false,"city":"New Orleans","name":"Creoles","shortName":"NO"', 2, 5),
          ]

          for marker, old, new in edits:
              start = text.find(marker)
              if start < 0:
                  raise SystemExit(f"Team marker not found: {marker}")
              end = text.find('"frontOffice":', start)
              if end < 0:
                  raise SystemExit(f"frontOffice boundary not found: {marker}")
              old_div = f'"division":{old}'
              pos = text.find(old_div, start, end)
              if pos < 0:
                  raise SystemExit(f"Expected {old_div} not found: {marker}")
              text = text[:pos] + f'"division":{new}' + text[pos + len(old_div):]

          path.write_text(text, encoding="utf-8")

      - name: Commit changes and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/rebalance-uba-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Leagues/UBA_Classic/United Basketball Association.txt" .github/workflows/rebalance-uba-temp.yml
          git commit -m "Rebalance UBA divisions geographically"
          git push
